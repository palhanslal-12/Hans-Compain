<svg viewBox="0 0 500 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Left Leaf Green Gradients -->
    <linearGradient id="hcLeafGrad" x1="0%" y1="100%" x2="40%" y2="0%">
      <stop offset="0%" stop-color="#15803D" />
      <stop offset="35%" stop-color="#22C55E" />
      <stop offset="75%" stop-color="#4ADE80" />
      <stop offset="100%" stop-color="#86EFAC" />
    </linearGradient>

    <linearGradient id="hcLeafDarkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#166534" />
      <stop offset="60%" stop-color="#15803D" />
      <stop offset="100%" stop-color="#14532D" />
    </linearGradient>

    <!-- Right Circuit Blue/Cyan Gradients -->
    <linearGradient id="hcCircuitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="45%" stop-color="#0284C7" />
      <stop offset="85%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>

    <linearGradient id="hcCyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Center Arch Gradient (Blend Green to Blue) -->
    <linearGradient id="hcArchGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Book Base Gradients -->
    <linearGradient id="hcBookLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86EFAC" />
      <stop offset="50%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>

    <linearGradient id="hcBookRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>

    <!-- Text Typography Gradient -->
    <linearGradient id="hcTextGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4ADE80" />
      <stop offset="100%" stop-color="#22C55E" />
    </linearGradient>

    <linearGradient id="hcTextBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <filter id="hcGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(0, 10)">
    <!-- LEFT SIDE: BOTANICAL LEAF "H" STEM -->
    <!-- Small outer leaf -->
    <path
      d="M 155 170 C 130 160 115 180 120 195 C 130 210 155 200 155 170 Z"
      fill="url(#hcLeafGrad)"
      opacity="0.9"
    />
    
    <!-- Main tall leaf curving into H stem -->
    <path
      d="M 130 65 C 135 60 180 80 195 140 C 205 180 185 240 185 270 L 155 270 C 155 230 165 170 150 140 C 135 110 125 70 130 65 Z"
      fill="url(#hcLeafGrad)"
    />
    
    <!-- Inner Leaf shading line -->
    <path
      d="M 130 65 Q 165 130 165 240"
      fill="none"
      stroke="#14532D"
      stroke-width="3"
      stroke-linecap="round"
      opacity="0.5"
    />

    <!-- Left Main Pillar of H -->
    <path
      d="M 155 130 C 155 130 195 145 195 210 L 195 310 C 180 310 155 305 155 295 L 155 130 Z"
      fill="url(#hcLeafGrad)"
    />

    <!-- RIGHT SIDE: CIRCUIT / TECH "H" STEM -->
    <!-- Right Main Pillar of H -->
    <path
      d="M 300 95 L 345 95 C 355 95 360 105 360 115 L 360 300 C 360 308 340 310 300 310 L 300 210 Z"
      fill="url(#hcCircuitGrad)"
    />

    <!-- Tech Circuit Traces & Glow Nodes -->
    <g stroke="url(#hcCyanGlow)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- Circuit 1 -->
      <path d="M 330 70 L 330 100 L 315 120 L 315 160" />
      <circle cx="330" cy="68" r="4.5" fill="#38BDF8" stroke="#FFFFFF" stroke-width="2" />
      
      <!-- Circuit 2 -->
      <path d="M 360 125 L 340 145 L 340 190 L 350 200" />
      <circle cx="360" cy="125" r="4" fill="#38BDF8" stroke="#FFFFFF" stroke-width="2" />

      <!-- Circuit 3 -->
      <path d="M 320 220 L 345 245 L 345 275" />
      <circle cx="345" cy="275" r="4.5" fill="#38BDF8" stroke="#FFFFFF" stroke-width="2" />
      <circle cx="318" cy="220" r="4" fill="#38BDF8" stroke="#FFFFFF" stroke-width="2" />

      <!-- Circuit 4 Node -->
      <path d="M 355 240 L 355 260" />
      <circle cx="355" cy="260" r="3.5" fill="#38BDF8" stroke="#FFFFFF" stroke-width="1.5" />
    </g>

    <!-- CENTER ARCH / BRIDGE CONNECTING H -->
    <path
      d="M 195 195 C 230 165 270 165 300 195 L 300 240 C 270 200 230 200 195 240 Z"
      fill="url(#hcArchGrad)"
    />

    <!-- AI SPEECH BUBBLE WITH 3 DOTS & SMILE INSIDE ARCH -->
    <g transform="translate(200, 200)">
      <!-- Bubble Background -->
      <path
        d="M 15 20 C 15 5 85 5 85 20 C 85 38 70 45 50 45 C 40 45 28 53 22 56 C 24 50 15 45 15 20 Z"
        fill="#070D1D"
        stroke="url(#hcCyanGlow)"
        stroke-width="2"
      />
      <!-- 3 AI Dots -->
      <circle cx="38" cy="22" r="3.5" fill="#67E8F9" />
      <circle cx="50" cy="22" r="3.5" fill="#38BDF8" />
      <circle cx="62" cy="22" r="3.5" fill="#60A5FA" />
      <!-- Smile Curve -->
      <path
        d="M 36 32 Q 50 40 64 32"
        fill="none"
        stroke="url(#hcCyanGlow)"
        stroke-width="2.5"
        stroke-linecap="round"
      />
    </g>

    <!-- BOTTOM BASE: OPEN ILLUMINATED BOOK -->
    <!-- Left Page (Green) -->
    <path
      d="M 120 345 C 170 325 225 320 250 355 C 225 340 170 340 125 358 Z"
      fill="url(#hcBookLeft)"
    />
    <path
      d="M 130 358 C 175 342 225 340 250 368 C 225 355 175 355 135 370 Z"
      fill="url(#hcBookLeft)"
      opacity="0.8"
    />

    <!-- Right Page (Blue) -->
    <path
      d="M 380 345 C 330 325 275 320 250 355 C 275 340 330 340 375 358 Z"
      fill="url(#hcBookRight)"
    />
    <path
      d="M 370 358 C 325 342 275 340 250 368 C 275 355 325 355 365 370 Z"
      fill="url(#hcBookRight)"
      opacity="0.8"
    />

    <!-- Book Center Spine -->
    <path
      d="M 250 345 L 250 372"
      stroke="#38BDF8"
      stroke-width="3.5"
      stroke-linecap="round"
    />
  </g>

  <!-- TYPOGRAPHY: HANS COMPAIN -->
  <g transform="translate(0, 420)">
    <!-- Brand Name -->
    <text
      x="185"
      y="30"
      text-anchor="end"
      fill="url(#hcTextGreen)"
      font-size="38"
      font-weight="900"
      font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
      letter-spacing="6"
    >HANS</text>
    
    <text
      x="205"
      y="30"
      text-anchor="start"
      fill="url(#hcTextBlue)"
      font-size="38"
      font-weight="900"
      font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
      letter-spacing="6"
    >COMPAIN</text>

    <!-- Subtitle: LEARN • ASK • GROW -->
    <g transform="translate(250, 60)">
      <!-- Left decorative line -->
      <line x1="-190" y1="-5" x2="-135" y2="-5" stroke="#22C55E" stroke-width="2" stroke-linecap="round" />
      
      <text
        x="-105"
        y="0"
        text-anchor="middle"
        fill="#86EFAC"
        font-size="14"
        font-weight="800"
        font-family="system-ui, sans-serif"
        letter-spacing="4"
      >LEARN</text>

      <circle cx="-60" cy="-4" r="3" fill="#22C55E" />

      <text
        x="0"
        y="0"
        text-anchor="middle"
        fill="#67E8F9"
        font-size="14"
        font-weight="800"
        font-family="system-ui, sans-serif"
        letter-spacing="4"
      >ASK</text>

      <circle cx="60" cy="-4" r="3" fill="#38BDF8" />

      <text
        x="105"
        y="0"
        text-anchor="middle"
        fill="#93C5FD"
        font-size="14"
        font-weight="800"
        font-family="system-ui, sans-serif"
        letter-spacing="4"
      >GROW</text>

      <!-- Right decorative line -->
      <line x1="135" y1="-5" x2="190" y2="-5" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
    </g>
  </g>
</svg>
