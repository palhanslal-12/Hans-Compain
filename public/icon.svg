<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>
  <!-- Background with Safe Margin -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#F59E0B" stroke-width="6" stroke-opacity="0.4" />
  
  <!-- Outer Glow Circle -->
  <circle cx="256" cy="240" r="150" fill="url(#goldGrad)" opacity="0.12" />
  <circle cx="256" cy="240" r="120" fill="none" stroke="url(#cyanGrad)" stroke-width="8" stroke-dasharray="16 8" />

  <!-- Central Target / Steno Feather & Shield Icon -->
  <path d="M256 120 L340 180 L340 280 Q340 370 256 410 Q172 370 172 280 L172 180 Z" fill="url(#goldGrad)" />
  <path d="M256 150 L315 195 L315 270 Q315 340 256 375 Q197 340 197 270 L197 195 Z" fill="#0F172A" />
  
  <!-- Target Rings -->
  <circle cx="256" cy="260" r="45" fill="none" stroke="#F59E0B" stroke-width="8" />
  <circle cx="256" cy="260" r="22" fill="#38BDF8" />
  
  <!-- Text Label -->
  <text x="256" y="465" font-family="system-ui, sans-serif" font-size="42" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">HANS COMPAIN</text>
</svg>
