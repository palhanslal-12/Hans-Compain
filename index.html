    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "HANS COMPAIN Shorthand",
        "alternateName": "HansCompain",
        "applicationCategory": "EducationalApplication",

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Rozha+One&family=Yatra+One&display=swap" rel="stylesheet">
    <script>
      window.__deferredPwaPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__deferredPwaPrompt = e;
        window.dispatchEvent(new Event('pwa-prompt-ready'));
      });
      window.addEventListener('appinstalled', function () {
        window.__deferredPwaPrompt = null;
        window.dispatchEvent(new Event('pwa-app-installed'));
      });
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js', { scope: '/' }).catch(function () {});
      }
      (function () {
        window.addEventListener('unhandledrejection', function (event) {
          var msg = event && event.reason ? (event.reason.message || String(event.reason)) : '';
          if (msg.indexOf('WebSocket closed without opened') !== -1 || msg.indexOf('@vite/client') !== -1) {
            event.preventDefault();
            event.stopPropagation();
            return false;
          }
          try {
            fetch('/api/admin/auto-alert', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                type: 'error_alert',
                title: 'Unhandled Promise Error in App',
                details: msg.slice(0, 500)
              })
            }).catch(function () {});
          } catch (e) {}
        }, true);

        window.addEventListener('error', function (event) {
          var msg = event && event.message ? String(event.message) : '';
          if (msg.indexOf('WebSocket closed without opened') !== -1) {
            event.preventDefault();
            return false;
          }
        }, true);
      })();
    </script>
